const { useState, useEffect, useMemo, useRef, useCallback } = React;

const STORAGE_KEY = 'gradebook-v3';
const DEFAULT_GRADE_SCALE = [{grade:'A',min:80},{grade:'B+',min:75},{grade:'B',min:70},{grade:'C+',min:65},{grade:'C',min:60},{grade:'D+',min:55},{grade:'D',min:50},{grade:'F',min:0}];

const ATTENDANCE_WEIGHT = { present:1, late:0.5, leave:0.5, absent:0 };

  folder: <><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></>,

};
const Icon = ({ name, size=16, className='', strokeWidth=2 }) => { const p = ICONS[name]; if (!p) return null; return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{p}</svg>; };

const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (n, d=1) => Number(n||0).toFixed(d);
const nowISO = () => new Date().toISOString();

function createDefaultClass(name='รายวิชาของฉัน') {
  const weeks = [];
  for (let i=1; i<=15; i++) weeks.push({ number:i, maxAttendance:5, assignments:[] });
  return { id:'cls-'+uid(), name, students:[], weeks, exams:[{id:'midterm',name:'สอบกลางภาค',maxScore:25},{id:'final',name:'สอบปลายภาค',maxScore:35}], attendance:{}, scores:{}, examScores:{}, gradeScale:structuredClone(DEFAULT_GRADE_SCALE), sync:{url:'',enabled:false,lastSyncAt:null}, updatedAt:nowISO() };
}
function createDefaultData() { const c = createDefaultClass(); return { version:3, classes:[c], activeClassId:c.id, theme:'cream' }; }
function migrateData(parsed) {
  if (parsed?.version===3 && parsed?.classes) return parsed;
  const cls = { ...createDefaultClass(parsed?.className||'รายวิชาของฉัน'), students:parsed?.students||[], weeks:parsed?.weeks||createDefaultClass().weeks, exams:parsed?.exams||createDefaultClass().exams, attendance:parsed?.attendance||{}, scores:parsed?.scores||{}, examScores:parsed?.examScores||{}, gradeScale:parsed?.gradeScale||structuredClone(DEFAULT_GRADE_SCALE), sync:parsed?.sync||{url:'',enabled:false,lastSyncAt:null} };
  return { version:3, classes:[cls], activeClassId:cls.id, theme:parsed?.theme||'cream' };
}
function getLetterGrade(pct, scale) { const s = [...scale].sort((a,b)=>b.min-a.min); for (const t of s) if (pct>=t.min) return t.grade; return 'F'; }
function calcStudent(cls, studentId, opts={}) {
  const upToWeek = opts.upToWeek ?? cls.weeks.length;
  const includeExams = opts.includeExams ?? true;
  let attE=0, attP=0, asgE=0, asgP=0, examE=0, examP=0, present=0, weeks=0;
  for (const w of cls.weeks) {
    if (w.number > upToWeek) continue;
    weeks++; attP += w.maxAttendance||0;
    const at = cls.attendance[`${w.number}-${studentId}`];
    if (at) { attE += (w.maxAttendance||0) * (ATTENDANCE_WEIGHT[at.status]??0); if (at.status==='present') present++; }
    for (const a of (w.assignments||[])) { asgP += a.maxScore||0; const s = cls.scores[`${w.number}-${studentId}-${a.id}`]; if (s && typeof s.score==='number') asgE += s.score; }
  }
  if (includeExams) for (const ex of (cls.exams||[])) { examP += ex.maxScore||0; const s = cls.examScores?.[`${ex.id}-${studentId}`]; if (s && typeof s.score==='number') examE += s.score; }
  const earned = attE+asgE+examE, possible = attP+asgP+examP, pct = possible>0?(earned/possible)*100:0;
  return { earned, possible, pct, attEarned:attE, attPossible:attP, asgEarned:asgE, asgPossible:asgP, examEarned:examE, examPossible:examP, presentCount:present, weeksConsidered:weeks, grade:getLetterGrade(pct, cls.gradeScale) };
}

const storage = {
  isClaudeArtifact: typeof window !== 'undefined' && !!window.storage,
  async get(key) { if (this.isClaudeArtifact) { try { const r = await window.storage.get(key); return r?.value ?? null; } catch { return null; } } return localStorage.getItem(key); },
  async set(key, value) { if (this.isClaudeArtifact) return window.storage.set(key, value); localStorage.setItem(key, value); },
  async delete(key) { if (this.isClaudeArtifact) { try { await window.storage.delete(key); } catch {} return; } localStorage.removeItem(key); }
};

async function syncToCloud(url, classData) {
  if (!url) return { ok:false, error:'no-url' };
  try {
    const res = await fetch(url, { method:'POST', mode:'cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(classData) });
    const txt = await res.text();
    try { const j = JSON.parse(txt); return j.ok?{ok:true}:{ok:false,error:j.error||'unknown'}; }
    catch { return res.ok?{ok:true}:{ok:false,error:'invalid-response'}; }
  } catch (e) { return { ok:false, error:e.message }; }
}
async function pullFromCloud(url) {
  if (!url) return { ok:false, error:'no-url' };
  try {
    const res = await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(), { method:'GET', mode:'cors' });
    const txt = await res.text();
    try { const j = JSON.parse(txt); return j.ok?{ok:true,data:j.data}:{ok:false,error:j.error||'unknown'}; }
    catch { return { ok:false, error:'invalid-response' }; }
  } catch (e) { return { ok:false, error:e.message }; }
}

const ToastContext = React.createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((message, type='info') => { const id = uid(); setToasts(t => [...t, {id,message,type}]); setTimeout(() => setToasts(t => t.filter(x => x.id!==id)), 3200); }, []);
  return <ToastContext.Provider value={show}>{children}
    <div className="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none">
      {toasts.map(t => <div key={t.id} className="toast pointer-events-auto px-4 py-2.5 rounded-xl border shadow-lg bg-surface text-ink border-line flex items-center gap-2 text-sm" style={{minWidth:200}}>
        <span className="w-1.5 h-1.5 rounded-full" style={{ background: t.type==='error'?'var(--bad)':t.type==='success'?'var(--good)':'var(--brand)' }}/>
        {t.message}
      </div>)}
    </div>
  </ToastContext.Provider>;
}
const useToast = () => React.useContext(ToastContext);

function useGradebook() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [syncStatus, setSyncStatus] = useState('idle');
  const [needsOnboarding, setNeedsOnboarding] = useState(false);
  const saveTimer = useRef(null);
  const syncTimer = useRef(null);
  const dataRef = useRef(null);
  const lastSyncedStamp = useRef(null);

  useEffect(() => { (async () => {
    try {
      const raw = await storage.get(STORAGE_KEY);
      if (raw) {
        const parsed = migrateData(JSON.parse(raw));
        const active = parsed.classes.find(c => c.id === parsed.activeClassId) || parsed.classes[0];
        if (active?.sync?.enabled && active?.sync?.url) {
          setSyncStatus('syncing');
          const res = await pullFromCloud(active.sync.url);
          if (res.ok && res.data) {
            const cloudT = res.data.updatedAt ? new Date(res.data.updatedAt).getTime() : 0;
            const localT = active.updatedAt ? new Date(active.updatedAt).getTime() : 0;
            if (cloudT >= localT) { const idx = parsed.classes.findIndex(c => c.id === active.id); parsed.classes[idx] = { ...res.data, id:active.id, sync:active.sync }; }
            setSyncStatus('synced'); setTimeout(() => setSyncStatus('idle'), 1500);
          } else { setSyncStatus('error'); setTimeout(() => setSyncStatus('idle'), 3000); }
        }
        setData(parsed);
      } else { setNeedsOnboarding(true); setData(createDefaultData()); }
    } catch { setData(createDefaultData()); setNeedsOnboarding(true); }
    finally { setLoading(false); }
  })(); }, []);

  useEffect(() => { if (data?.theme) document.documentElement.setAttribute('data-theme', data.theme); }, [data?.theme]);

  useEffect(() => {
    if (!data) return;
    dataRef.current = data;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => { setSaving(true); try { await storage.set(STORAGE_KEY, JSON.stringify(dataRef.current)); } finally { setSaving(false); } }, 400);
    const active = data.classes.find(c => c.id === data.activeClassId);
    if (active?.sync?.enabled && active?.sync?.url) {
      const stamp = JSON.stringify({s:active.students,w:active.weeks,a:active.attendance,sc:active.scores,e:active.exams,es:active.examScores,gs:active.gradeScale,n:active.name});
      if (lastSyncedStamp.current === stamp) return;
      if (syncTimer.current) clearTimeout(syncTimer.current);
      syncTimer.current = setTimeout(async () => {
        setSyncStatus('syncing');
        const res = await syncToCloud(active.sync.url, active);
        if (res.ok) {
          lastSyncedStamp.current = stamp; setSyncStatus('synced');
          setData(d => { const c = structuredClone(d); const cls = c.classes.find(x => x.id===active.id); if (cls) cls.sync.lastSyncAt = nowISO(); return c; });
          setTimeout(() => setSyncStatus('idle'), 1500);
        } else { setSyncStatus('error'); setTimeout(() => setSyncStatus('idle'), 3000); }
      }, 1500);
    }
  }, [data]);

  useEffect(() => {
    const onFocus = async () => {
      const d = dataRef.current; if (!d) return;
      const active = d.classes.find(c => c.id === d.activeClassId);
      if (!active?.sync?.enabled || !active?.sync?.url) return;
      const res = await pullFromCloud(active.sync.url);
      if (!res.ok || !res.data) return;
      const cloudT = res.data.updatedAt ? new Date(res.data.updatedAt).getTime() : 0;
      const localT = active.updatedAt ? new Date(active.updatedAt).getTime() : 0;
      if (cloudT > localT) setData(prev => { const c = structuredClone(prev); const idx = c.classes.findIndex(x => x.id===active.id); if (idx>=0) c.classes[idx] = { ...res.data, id:active.id, sync:active.sync }; return c; });
    };
    const vis = () => { if (!document.hidden) onFocus(); };
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', vis);
    return () => { window.removeEventListener('focus', onFocus); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const update = (fn) => setData(prev => fn(structuredClone(prev)));
  const updateActive = (fn) => update(d => { const cls = d.classes.find(c => c.id === d.activeClassId); if (cls) { fn(cls); cls.updatedAt = nowISO(); } return d; });
  return { data, setData, update, updateActive, loading, saving, syncStatus, needsOnboarding, setNeedsOnboarding };
}

function TrendChart({ cls }) {
  const points = useMemo(() => cls.weeks.map(w => { const avgs = cls.students.map(s => calcStudent(cls, s.id, {upToWeek:w.number, includeExams:false}).pct); const avg = avgs.length ? avgs.reduce((a,b)=>a+b,0)/avgs.length : 0; return {week:w.number, value:avg}; }), [cls]);
  if (points.length===0 || cls.students.length===0) return <div className="text-sm text-dim text-center py-8">ยังไม่มีข้อมูล</div>;
  const W=560, H=200, P={l:40,r:16,t:16,b:28};
  const xStep = (W-P.l-P.r)/Math.max(1, points.length-1);
  const yScale = v => P.t + (H-P.t-P.b)*(1-v/100);
  const path = points.map((p,i) => `${i===0?'M':'L'} ${P.l+i*xStep} ${yScale(p.value)}`).join(' ');
  const area = `${path} L ${P.l+(points.length-1)*xStep} ${H-P.b} L ${P.l} ${H-P.b} Z`;
  const pathLen = points.length*80;
  return <svg viewBox={`0 0 ${W} ${H}`} className="w-full" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--brand)" stopOpacity="0.18"/><stop offset="100%" stopColor="var(--brand)" stopOpacity="0"/></linearGradient></defs>
    {[0,25,50,75,100].map(v => <g key={v}><line x1={P.l} y1={yScale(v)} x2={W-P.r} y2={yScale(v)} stroke="var(--line)" strokeDasharray="3 4"/><text x={P.l-8} y={yScale(v)+3} fontSize="10" textAnchor="end" fill="var(--dim)">{v}</text></g>)}
    {points.map((p,i) => i % Math.max(1, Math.ceil(points.length/8))===0 ? <text key={i} x={P.l+i*xStep} y={H-10} fontSize="10" textAnchor="middle" fill="var(--dim)">{p.week}</text> : null)}
    <path d={area} fill="url(#trendFill)"/>
    <path d={path} fill="none" stroke="var(--brand)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" style={{strokeDasharray:pathLen, '--len':pathLen, animation:`drawLine 1.5s cubic-bezier(0.16,1,0.3,1) both`}}/>
    {points.map((p,i) => <circle key={i} cx={P.l+i*xStep} cy={yScale(p.value)} r="3.5" fill="var(--surface)" stroke="var(--brand)" strokeWidth="2" className="a-fadeUp" style={{animationDelay:`${600+i*60}ms`}}/>)}
  </svg>;
}
function DistributionChart({ cls }) {
  const grades = ['A','B+','B','C+','C','D+','D','F'];
  const counts = useMemo(() => { const m = Object.fromEntries(grades.map(g => [g,0])); for (const s of cls.students) { const t = calcStudent(cls, s.id); if (m[t.grade]!==undefined) m[t.grade]+=1; } return m; }, [cls]);
  const max = Math.max(1, ...Object.values(counts));
  return <div className="space-y-2">{grades.map(g => { const pct = (counts[g]/max)*100; return <div key={g} className="flex items-center gap-3"><div className="w-9 flex-shrink-0"><GradeBadge grade={g} size="sm"/></div><div className="flex-1 h-7 rounded-md overflow-hidden" style={{background:'var(--surface-2)'}}><div className="h-full rounded-md transition-all" style={{width:`${pct}%`, background:'var(--brand)', opacity:counts[g]===0?0.15:0.85, animation:'slideRight 0.6s cubic-bezier(0.16,1,0.3,1) both'}}/></div><div className="w-10 text-right text-sm text-dim tabular-nums">{counts[g]}</div></div>; })}</div>;
}

const APPS_SCRIPT_CODE = `// Gradebook ↔ Google Sheets sync
// 1) เปิด Google Sheet ที่จะใช้เป็น backup
// 2) Extensions → Apps Script
// 3) ลบโค้ดเดิมและวางโค้ดนี้ทับ → กดบันทึก (ดิสก์)
// 4) Deploy → New deployment → Web app
// 5) Execute as: Me  |  Who has access: Anyone (with the link)
// 6) Authorize → คัดลอก Web app URL → วางลงในแอป
//
// ⚠️ 1 ห้องเรียน = 1 Sheet (= 1 web app URL)
// หลาย section ทำตามขั้นตอนเดียวกันใน Sheet ใหม่ของแต่ละห้อง

function doGet(e) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const sh = ss.getSheetByName('_backup');
    if (!sh) return out({ ok:true, data:null });
    const raw = sh.getRange('A2').getValue();
    return out({ ok:true, data: raw ? JSON.parse(raw) : null });
  } catch (err) { return out({ ok:false, error:String(err) }); }
}
function doPost(e) {
  try {
    const data = JSON.parse(e.postData.contents);
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    let backup = ss.getSheetByName('_backup') || ss.insertSheet('_backup');
    backup.clear();
    backup.getRange('A1:B1').setValues([['data','updatedAt']]);
    backup.getRange('A2:B2').setValues([[JSON.stringify(data), new Date().toISOString()]]);
    writeSummary(ss, data);
    return out({ ok:true });
  } catch (err) { return out({ ok:false, error:String(err) }); }
}
function out(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }
function writeSummary(ss, cls) {
  let sheet = ss.getSheetByName('สรุปคะแนน') || ss.insertSheet('สรุปคะแนน');
  sheet.clear();
  const W = { present:1, late:0.5, leave:0.5, absent:0 };
  const header = ['รหัส','ชื่อ','ชื่อเล่น'];
  for (const w of cls.weeks) header.push('W'+w.number);
  for (const ex of (cls.exams||[])) header.push(ex.name);
  header.push('รวม','%','เกรด');
  const rows = [header];
  for (const s of cls.students) {
    const row = [s.studentId, s.name, s.nickname||''];
    let earned=0, possible=0;
    for (const w of cls.weeks) {
      let we=0, wp=(w.maxAttendance||0);
      const at = cls.attendance[w.number+'-'+s.id];
      if (at) we += (w.maxAttendance||0) * (W[at.status]||0);
      for (const a of (w.assignments||[])) { wp += a.maxScore||0; const sc = cls.scores[w.number+'-'+s.id+'-'+a.id]; if (sc && typeof sc.score==='number') we += sc.score; }
      row.push(we); earned += we; possible += wp;
    }
    for (const ex of (cls.exams||[])) { const sc = (cls.examScores||{})[ex.id+'-'+s.id]; const v = sc && typeof sc.score==='number' ? sc.score : 0; row.push(v); earned += v; possible += ex.maxScore||0; }
    const pct = possible>0 ? (earned/possible)*100 : 0;
    const sorted = [...cls.gradeScale].sort((a,b) => b.min-a.min);
    let grade='F';
    for (const t of sorted) if (pct>=t.min) { grade=t.grade; break; }
    row.push(earned, pct.toFixed(2)+'%', grade);
    rows.push(row);
  }
  sheet.getRange(1,1,rows.length,rows[0].length).setValues(rows);
  sheet.getRange(1,1,1,rows[0].length).setFontWeight('bold').setBackground('#1F1B16').setFontColor('#FFFFFF');
  sheet.setFrozenRows(1); sheet.setFrozenColumns(3);
}`;

          <Button variant="outline" onClick={() => dup(duplicating, false)} className="w-full justify-start text-left !py-3"><div className="text-left"><div className="font-medium">📋 คัดลอกเฉพาะโครงสร้าง</div><div className="text-xs text-dim font-normal">สัปดาห์, การสอบ, เกณฑ์เกรด (ไม่รวมนักศึกษา/คะแนน)</div></div></Button>
          <Button variant="outline" onClick={() => dup(duplicating, true)} className="w-full justify-start text-left !py-3"><div className="text-left"><div className="font-medium">📚 คัดลอกทั้งหมด</div><div className="text-xs text-dim font-normal">รวมนักศึกษาและคะแนน</div></div></Button>
        </div>
        <Button variant="ghost" onClick={() => setDuplicating(null)} className="w-full">ยกเลิก</Button>
      </div>}
    </Modal>
    <Modal open={!!confirmDelete} onClose={() => setConfirmDelete(null)} title="ยืนยันการลบห้อง">
      {confirmDelete && <div className="space-y-4">
        <div className="flex gap-3 p-3 rounded-lg" style={{background:'color-mix(in srgb, var(--bad) 8%, transparent)', border:'1px solid color-mix(in srgb, var(--bad) 25%, transparent)'}}><Icon name="alert" size={20} className="flex-shrink-0" style={{color:'var(--bad)'}}/><p className="text-sm text-ink">ลบห้อง <strong>{confirmDelete.name}</strong> — นักศึกษา {confirmDelete.students.length} คนและคะแนนจะหายถาวร<br/><span className="text-xs text-dim">ข้อมูลใน Google Sheets ยังอยู่</span></p></div>
        <div className="flex justify-end gap-2"><Button variant="ghost" onClick={() => setConfirmDelete(null)}>ยกเลิก</Button><Button variant="brand" onClick={() => remove(confirmDelete.id)} className="!bg-[var(--bad)] !border-[var(--bad)]"><Icon name="trash" size={14}/>ลบห้อง</Button></div>
      </div>}
    </Modal>
  </>;
}

function SettingsView({ data, update, cls, updateActive, exportCsv, importJson, exportJson, resetAll, doPullCloud, doPushCloud }) {
  const fileRef = useRef();
  const [syncSetupOpen, setSyncSetupOpen] = useState(false);
  const toast = useToast();
  const setWeekCount = (n) => { const num = Math.max(1, Math.min(60, Number(n)||1)); updateActive(c => { const cur = c.weeks.length; if (num>cur) for (let i=cur+1; i<=num; i++) c.weeks.push({number:i, maxAttendance:5, assignments:[]}); else if (num<cur) { const rm = c.weeks.slice(num).map(w => w.number); c.weeks = c.weeks.slice(0, num); for (const k of Object.keys(c.attendance)) { const wn = Number(k.split('-')[0]); if (rm.includes(wn)) delete c.attendance[k]; } for (const k of Object.keys(c.scores)) { const wn = Number(k.split('-')[0]); if (rm.includes(wn)) delete c.scores[k]; } } }); };
  return <div className="space-y-6 a-fadeUp">
    <div><h2 className="font-display text-2xl text-ink">ตั้งค่า</h2><p className="text-sm text-dim mt-1">การตั้งค่าของห้อง "<strong>{cls.name}</strong>" + การตั้งค่าทั่วไป</p></div>
    <Card className="p-5">
      <div className="flex items-center gap-2 mb-1"><Icon name="sparkle" size={16}/><h3 className="font-display text-lg text-ink">ธีมสี</h3><span className="text-xs text-dim ml-2">(ทั่วไป)</span></div>
      <p className="text-sm text-dim mb-4">เลือกบรรยากาศของแอป</p>
      <div className="flex flex-wrap gap-2">{THEMES.map(t => { const active = data.theme===t.id; return <button key={t.id} onClick={() => update(d => { d.theme = t.id; return d; })} className={`btn flex items-center gap-2 px-3 py-2 rounded-xl border text-sm ${active?'border-ink':'border-line hover:border-dim'}`}><span className="w-4 h-4 rounded-full" style={{background:t.dot}}/>{t.name}</button>; })}</div>
    </Card>
    <Card className="p-5">
      <div className="flex items-center gap-2 mb-1"><Icon name="cloud" size={16}/><h3 className="font-display text-lg text-ink">Cloud Sync — Google Sheets</h3><span className="text-xs text-dim ml-2">(ของห้องนี้)</span></div>
      <p className="text-sm text-dim mb-4">บันทึกอัตโนมัติไปยัง Google Sheets ของห้อง "<strong>{cls.name}</strong>"</p>
      {!cls.sync?.url ? <div className="space-y-3"><div className="flex gap-3 p-3 rounded-lg" style={{background:'var(--surface-2)'}}><Icon name="cloud" size={20} className="flex-shrink-0 mt-0.5" style={{color:'var(--brand)'}}/><div className="text-sm text-ink">เมื่อตั้งค่าแล้ว เปิดบนเครื่องไหนก็ดึงข้อมูลล่าสุดอัตโนมัติ</div></div><Button variant="brand" onClick={() => setSyncSetupOpen(true)}><Icon name="cloud" size={14}/>ตั้งค่า Cloud Sync</Button></div> : <div className="space-y-3">
        <div><label className="block text-xs font-medium text-dim mb-1">Web app URL</label><div className="flex gap-2"><Input value={cls.sync.url} onChange={e => updateActive(c => { c.sync.url = e.target.value; })} placeholder="https://script.google.com/macros/s/.../exec"/><Button variant="outline" onClick={() => setSyncSetupOpen(true)} title="ดูวิธีตั้งค่า"><Icon name="book" size={14}/></Button></div></div>
        <div className="flex items-center gap-3 flex-wrap"><label className="inline-flex items-center gap-2 text-sm"><input type="checkbox" checked={cls.sync.enabled} onChange={e => updateActive(c => { c.sync.enabled = e.target.checked; })}/>เปิด auto-sync (Cloud-first mode)</label></div>
        <div className="flex flex-wrap gap-2 pt-1"><Button variant="outline" onClick={doPushCloud}><Icon name="upload" size={14}/>Push ตอนนี้</Button><Button variant="outline" onClick={doPullCloud}><Icon name="download" size={14}/>Pull จาก Sheets</Button>{cls.sync.lastSyncAt && <span className="text-xs text-dim self-center">บันทึกล่าสุด: {new Date(cls.sync.lastSyncAt).toLocaleString('th-TH')}</span>}</div>
      </div>}
    </Card>
    <Card className="p-5"><h3 className="font-display text-lg text-ink mb-4">ข้อมูลห้อง</h3><div className="space-y-3 max-w-md"><div><label className="block text-xs font-medium text-dim mb-1">ชื่อห้องเรียน</label><Input value={cls.name} onChange={e => updateActive(c => { c.name = e.target.value; })}/></div><div><label className="block text-xs font-medium text-dim mb-1">จำนวนสัปดาห์ทั้งหมด</label><Input type="number" value={cls.weeks.length} onChange={e => setWeekCount(e.target.value)} min={1} max={60}/></div></div></Card>
    <Card className="p-5"><h3 className="font-display text-lg text-ink mb-1">คะแนนจิตพิสัยรายสัปดาห์</h3><p className="text-sm text-dim mb-4">กำหนดคะแนนเต็มของแต่ละสัปดาห์</p><div className="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-2">{cls.weeks.map(w => <div key={w.number} className="flex items-center gap-2 p-2 border border-line rounded-lg"><span className="text-xs text-dim w-14 flex-shrink-0">สัปดาห์ {w.number}</span><Input type="number" value={w.maxAttendance} onChange={e => updateActive(c => { const ww = c.weeks.find(x => x.number===w.number); ww.maxAttendance = Number(e.target.value)||0; })} className="flex-1 min-w-0 !px-2 !py-1"/></div>)}</div></Card>
    <Card className="p-5"><h3 className="font-display text-lg text-ink mb-1">เกณฑ์เกรด</h3><p className="text-sm text-dim mb-4">ปรับคะแนนขั้นต่ำของแต่ละเกรด (%)</p><div className="space-y-2">{cls.gradeScale.map((tier,i) => <div key={i} className="flex items-center gap-3"><GradeBadge grade={tier.grade}/><span className="text-sm text-dim">ขั้นต่ำ</span><Input type="number" value={tier.min} onChange={e => updateActive(c => { c.gradeScale[i].min = Number(e.target.value); })} className="w-24"/><span className="text-sm text-dim">%</span></div>)}</div></Card>
    <Card className="p-5"><h3 className="font-display text-lg text-ink mb-1">ข้อมูล</h3><p className="text-sm text-dim mb-4">นำเข้า / ส่งออก / ล้างข้อมูล</p><div className="flex flex-wrap gap-2"><Button variant="outline" onClick={exportCsv}><Icon name="download" size={14}/>CSV (ห้องนี้)</Button><Button variant="outline" onClick={exportJson}><Icon name="download" size={14}/>JSON สำรอง (ทั้งหมด)</Button><Button variant="outline" onClick={() => fileRef.current?.click()}><Icon name="upload" size={14}/>นำเข้าสำรอง</Button><input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={async e => { const f = e.target.files?.[0]; if (!f) return; const text = await f.text(); importJson(text); e.target.value=''; }}/><Button variant="danger" onClick={resetAll}><Icon name="trash" size={14}/>ล้างข้อมูลทั้งหมด</Button></div></Card>
    <SyncSetupModal open={syncSetupOpen} onClose={() => setSyncSetupOpen(false)} currentUrl={cls.sync?.url||''} onSave={(url) => { updateActive(c => { c.sync.url = url; c.sync.enabled = true; }); setSyncSetupOpen(false); toast('ตั้งค่า Cloud Sync แล้ว','success'); }}/>
  </div>;
}

function SyncSetupModal({ open, onClose, currentUrl, onSave }) {
  const [url, setUrl] = useState(currentUrl);
  const [copied, setCopied] = useState(false);
  useEffect(() => setUrl(currentUrl), [currentUrl, open]);
  const copy = async () => { try { await navigator.clipboard.writeText(APPS_SCRIPT_CODE); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch {} };
  return <Modal open={open} onClose={onClose} title="ตั้งค่า Cloud Sync" maxWidth="max-w-2xl">
    <div className="space-y-4 text-sm">
      <ol className="space-y-2 list-decimal list-inside text-ink">
        <li>เปิด <a href="https://sheets.new" target="_blank" rel="noopener" className="underline" style={{color:'var(--brand)'}}>Google Sheets ใหม่ <Icon name="external" size={12} className="inline"/></a> สำหรับห้องนี้</li>
        <li>คลิก <strong>Extensions → Apps Script</strong></li>
        <li>ลบโค้ดเดิม วางโค้ดด้านล่างทับ</li>
        <li>กดบันทึก → <strong>Deploy</strong> → <strong>New deployment</strong></li>
        <li>กดไอคอน ⚙️ → เลือก <strong>Web app</strong></li>
        <li><strong>Execute as: Me</strong>, <strong>Who has access: Anyone</strong></li>
        <li>กด <strong>Deploy</strong> → อนุญาตสิทธิ์ → คัดลอก <strong>Web app URL</strong></li>
        <li>วาง URL ลงในช่องด้านล่าง</li>
      </ol>
      <div><div className="flex items-center justify-between mb-2"><label className="text-xs font-medium text-dim">โค้ด Apps Script</label><Button size="sm" variant="outline" onClick={copy}><Icon name="copy" size={12}/>{copied?'คัดลอกแล้ว':'คัดลอกโค้ด'}</Button></div><pre className="text-[11px] font-mono p-3 rounded-lg overflow-x-auto max-h-48 border border-line" style={{background:'var(--surface-2)'}}>{APPS_SCRIPT_CODE}</pre></div>
      <div><label className="block text-xs font-medium text-dim mb-1">Web app URL</label><Input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"/></div>
      <div className="flex gap-3 p-3 rounded-lg text-xs" style={{background:'var(--surface-2)'}}><Icon name="alert" size={16} className="flex-shrink-0 mt-0.5" style={{color:'var(--warn)'}}/><div className="text-ink">URL นี้เปรียบเสมือนกุญแจสู่ Sheets อย่าแชร์ให้ผู้อื่น</div></div>
      <div className="flex justify-end gap-2"><Button variant="ghost" onClick={onClose}>ยกเลิก</Button><Button variant="brand" onClick={() => onSave(url.trim())} disabled={!url.trim().startsWith('http')}><Icon name="save" size={14}/>บันทึก</Button></div>
    </div>
  </Modal>;
}

function OnboardingModal({ open, onClose, onRestore }) {
  const [url, setUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const toast = useToast();
  const restore = async () => { if (!url.trim().startsWith('http')) return; setBusy(true); const res = await pullFromCloud(url.trim()); setBusy(false); if (res.ok && res.data) { onRestore(url.trim(), res.data); toast('ดึงข้อมูลสำเร็จ','success'); } else toast(`ดึงไม่สำเร็จ: ${res.error||'ไม่พบข้อมูล'}`,'error'); };
  return <Modal open={open} onClose={onClose} title="ยินดีต้อนรับ" maxWidth="max-w-xl">
    <div className="space-y-4">
      <p className="text-sm text-dim">เริ่มต้นใช้งานครั้งแรก เลือกวิธี:</p>
      <button onClick={onClose} className="w-full text-left p-4 border border-line rounded-xl hover:border-dim transition-colors"><div className="font-display text-lg text-ink">✨ เริ่มต้นใหม่</div><div className="text-sm text-dim mt-1">สร้างห้องเรียนเปล่า เพิ่มนักศึกษาเองทีหลัง</div></button>
      <div className="p-4 border border-line rounded-xl"><div className="font-display text-lg text-ink">☁️ ดึงข้อมูลจาก Google Sheets</div><div className="text-sm text-dim mt-1 mb-3">ถ้าตั้งค่า Cloud Sync ไว้แล้วจากเครื่องอื่น วาง Web app URL ที่นี่</div><div className="flex gap-2"><Input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"/><Button variant="brand" onClick={restore} disabled={busy||!url.trim().startsWith('http')}>{busy ? <Icon name="refresh" size={14} className="spinner"/> : <Icon name="download" size={14}/>}ดึงข้อมูล</Button></div></div>
    </div>
  </Modal>;
}

const NAV = [
  {id:'dashboard', label:'ภาพรวม', icon:'dashboard'},
  {id:'students', label:'นักศึกษา', icon:'users'},
  {id:'weekly', label:'รายสัปดาห์', icon:'calendar'},
  {id:'exams', label:'การสอบ', icon:'book'},
  {id:'settings', label:'ตั้งค่า', icon:'settings'},
];

function AppInner() {
  const { data, setData, update, updateActive, loading, saving, syncStatus, needsOnboarding, setNeedsOnboarding } = useGradebook();
  const [tab, setTab] = useState('dashboard');
  const [confirmReset, setConfirmReset] = useState(false);
  const [classManagerOpen, setClassManagerOpen] = useState(false);
  const toast = useToast();
  const activeClass = data?.classes.find(c => c.id===data.activeClassId) || data?.classes[0];

  const exportCsv = () => {
    if (!activeClass) return;
    const head = ['รหัส','ชื่อ','ชื่อเล่น'];
    for (const w of activeClass.weeks) head.push(`W${w.number}`);
    for (const ex of (activeClass.exams||[])) head.push(ex.name);
    head.push('รวม','%','เกรด');
    const rows = [head];
    for (const s of activeClass.students) {
      const r = [s.studentId, s.name, s.nickname||''];
      let earned=0, possible=0;
      for (const w of activeClass.weeks) { let we=0, wp=w.maxAttendance||0; const at = activeClass.attendance[`${w.number}-${s.id}`]; if (at) we += (w.maxAttendance||0)*(ATTENDANCE_WEIGHT[at.status]||0); for (const a of (w.assignments||[])) { wp += a.maxScore||0; const sc = activeClass.scores[`${w.number}-${s.id}-${a.id}`]; if (sc?.score) we += sc.score; } r.push(we.toFixed(2)); earned += we; possible += wp; }
      for (const ex of (activeClass.exams||[])) { const sc = activeClass.examScores?.[`${ex.id}-${s.id}`]; const v = sc?.score||0; r.push(v); earned += v; possible += ex.maxScore||0; }
      const pct = possible>0 ? (earned/possible)*100 : 0;
      r.push(earned.toFixed(2), pct.toFixed(2)+'%', getLetterGrade(pct, activeClass.gradeScale));
      rows.push(r);
    }
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${activeClass.name||'gradebook'}.csv`; a.click();
    URL.revokeObjectURL(url);
    toast('ดาวน์โหลด CSV แล้ว','success');
  };
  const exportJson = () => { if (!data) return; const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `gradebook-backup.json`; a.click(); URL.revokeObjectURL(url); toast('ดาวน์โหลด JSON แล้ว','success'); };
  const importJson = (text) => { try { const parsed = migrateData(JSON.parse(text)); setData(parsed); toast('นำเข้าข้อมูลแล้ว','success'); } catch { toast('ไฟล์ไม่ถูกต้อง','error'); } };
  const doPushCloud = async () => { if (!activeClass?.sync?.url) { toast('ยังไม่ได้ตั้งค่า URL','error'); return; } toast('กำลัง push...','info'); const res = await syncToCloud(activeClass.sync.url, activeClass); if (res.ok) { updateActive(c => { c.sync.lastSyncAt = nowISO(); }); toast('Push สำเร็จ','success'); } else toast(`Push ไม่สำเร็จ: ${res.error}`,'error'); };
  const doPullCloud = async () => { if (!activeClass?.sync?.url) { toast('ยังไม่ได้ตั้งค่า URL','error'); return; } if (!confirm('การ Pull จะเขียนทับข้อมูลในเครื่อง คุณแน่ใจหรือไม่?')) return; toast('กำลัง pull...','info'); const res = await pullFromCloud(activeClass.sync.url); if (res.ok && res.data) { update(d => { const idx = d.classes.findIndex(c => c.id===activeClass.id); if (idx>=0) d.classes[idx] = { ...res.data, id:activeClass.id, sync:activeClass.sync }; return d; }); toast('Pull สำเร็จ','success'); } else toast(`Pull ไม่สำเร็จ: ${res.error||'ไม่พบข้อมูล'}`,'error'); };
  const doReset = async () => { await storage.delete(STORAGE_KEY); setData(createDefaultData()); setConfirmReset(false); toast('ล้างข้อมูลแล้ว','success'); };
  const onRestoreFromCloud = (url, classData) => { setData(prev => { const copy = structuredClone(prev); const cls = { ...classData, id:'cls-'+uid(), sync:{url, enabled:true, lastSyncAt:nowISO()} }; copy.classes = [cls]; copy.activeClassId = cls.id; return copy; }); setNeedsOnboarding(false); };

  if (loading || !data) return <div className="min-h-screen flex items-center justify-center bg-bg"><div className="text-dim text-sm flex items-center gap-2"><Icon name="refresh" size={16} className="spinner"/>กำลังโหลด…</div></div>;

  return <div className="min-h-screen bg-bg text-ink">
    <header className="border-b border-line bg-bg/85 backdrop-blur-md sticky top-0 z-30">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-3">
        <div className="flex items-center gap-3 min-w-0 flex-shrink">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:'var(--ink)', color:'var(--bg)'}}><Icon name="award" size={18}/></div>
          <div className="min-w-0"><div className="font-display text-base sm:text-lg leading-tight text-ink truncate">Gradebook</div><div className="text-[11px] text-dim">ระบบบันทึกคะแนน</div></div>
        </div>
        <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">
          {syncStatus==='syncing' && <span className="text-xs text-dim hidden sm:flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full animate-pulse" style={{background:'var(--info)'}}/>sync…</span>}
          {syncStatus==='synced' && <span className="text-xs hidden sm:flex items-center gap-1.5" style={{color:'var(--good)'}}><Icon name="check" size={12}/>Synced</span>}
          {syncStatus==='error' && <span className="text-xs hidden sm:flex items-center gap-1.5" style={{color:'var(--bad)'}}><Icon name="alert" size={12}/>error</span>}
          {syncStatus==='idle' && saving && <span className="text-xs text-dim hidden sm:flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full animate-pulse" style={{background:'var(--good)'}}/>บันทึก…</span>}
          <ClassSwitcher data={data} update={update} onManage={() => setClassManagerOpen(true)}/>
        </div>
      </div>
      <div className="max-w-7xl mx-auto px-4 sm:px-6 overflow-x-auto scrollbar-thin">
        <nav className="flex gap-1 -mb-px min-w-max">{NAV.map(n => { const active = tab===n.id; return <button key={n.id} onClick={() => setTab(n.id)} data-active={active} className={`tab-btn flex items-center gap-2 px-4 py-3 text-sm font-medium ${active?'text-ink':'text-dim hover:text-ink'}`}><Icon name={n.icon} size={15}/>{n.label}</button>; })}</nav>
      </div>
    </header>
    <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8" key={`${tab}-${activeClass?.id}`}>
      {tab==='dashboard' && <Dashboard cls={activeClass}/>}
      {tab==='students' && <StudentsView cls={activeClass} updateActive={updateActive}/>}
      {tab==='weekly' && <WeeklyView cls={activeClass} updateActive={updateActive}/>}
      {tab==='exams' && <ExamsView cls={activeClass} updateActive={updateActive}/>}
      {tab==='settings' && <SettingsView data={data} update={update} cls={activeClass} updateActive={updateActive} exportCsv={exportCsv} exportJson={exportJson} importJson={importJson} resetAll={() => setConfirmReset(true)} doPushCloud={doPushCloud} doPullCloud={doPullCloud}/>}
    </main>
    <ClassManager open={classManagerOpen} onClose={() => setClassManagerOpen(false)} data={data} update={update}/>
    <OnboardingModal open={needsOnboarding} onClose={() => setNeedsOnboarding(false)} onRestore={onRestoreFromCloud}/>
    <Modal open={confirmReset} onClose={() => setConfirmReset(false)} title="ล้างข้อมูลทั้งหมด">
      <div className="space-y-4">
        <div className="flex gap-3 p-3 rounded-lg" style={{background:'color-mix(in srgb, var(--bad) 8%, transparent)'}}><Icon name="alert" size={20} className="flex-shrink-0 mt-0.5" style={{color:'var(--bad)'}}/><p className="text-sm text-ink">จะลบ <strong>ทุกห้อง</strong> และข้อมูลทั้งหมด แนะนำให้กด ส่งออกสำรอง JSON ก่อน</p></div>
        <div className="flex justify-end gap-2"><Button variant="ghost" onClick={() => setConfirmReset(false)}>ยกเลิก</Button><Button variant="brand" onClick={doReset} className="!bg-[var(--bad)] !border-[var(--bad)]"><Icon name="trash" size={14}/>ล้างทั้งหมด</Button></div>
      </div>
    </Modal>
    <footer className="max-w-7xl mx-auto px-6 py-8 text-center text-xs text-dim">ห้อง "{activeClass?.name}" · {activeClass?.sync?.enabled ? '☁️ cloud-sync เปิดอยู่' : '💾 local · กดส่งออกสำรองเป็นระยะ'}</footer>
  </div>;
}
function App() { return <ToastProvider><AppInner/></ToastProvider>; }
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
